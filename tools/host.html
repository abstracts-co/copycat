<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copycat on a local stand-in for abstracts.co</title>
<style>html,body{margin:0;background:#111;height:100%}iframe{border:0;display:block;width:100%;height:100%}</style>
<body>
<iframe id="f" allow="camera; microphone; autoplay; fullscreen" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals allow-downloads"></iframe>
<script>
// Stands in for the abstracts.co page around the artifact: answers the host bridge (docs/plans/artifact-platform.md
// in abstracts.co) so the app can be tested without the site. ?user=name signs in as that member;
// ?rooms=ws://localhost:8812 points parties at tools/room-server.mjs; ?host= is passed to the app for mock data.
const q = new URLSearchParams(location.search), user = q.get('user');
const app = new URL('/artifacts/copycat/index.html', location.href);
if (q.get('host')) app.searchParams.set('host', q.get('host'));
f.src = app.href;
const methods = {
  hello: () => ({ version: 1, community: 'copycat', artifact: 'copycat', post: null, signedIn: !!user, launch: Object.fromEntries([...q].filter(([k]) => k.startsWith('a_')).map(([k, v]) => [k.slice(2), v])) }),
  viewer: () => { if (!user) throw { code: 'signed_out', message: 'Sign in first.' }; return { username: user, name: user[0].toUpperCase() + user.slice(1), avatar: null, member: 1, profile: `https://abstracts.co/u/${user}` }; },
  roomToken: ({ room }) => {
    if (!user) throw { code: 'signed_out', message: 'Sign in first.' };
    const code = room || Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
    return { room: code, token: user, url: `${q.get('rooms') || 'ws://localhost:8812'}/rooms/copycat/copycat/${code}`, ice: [{ urls: 'stun:stun.cloudflare.com:3478' }], expires: Date.now() / 1000 + 600 };
  },
  share: ({ url }) => { console.log('share', url); return { shared: false }; },
  vote: ({ value }) => ({ value, counts: { up: value ? 1 : 0, down: 0 } }),
  save: ({ saved }) => ({ saved }),
  reply: () => ({ reply: { id: 'r1', url: '#' } }),
  open: ({ path }) => { console.log('open', path); return {}; },
  signIn: () => ({}),
  post: ({ files }) => { console.log('post', files.map((x) => `${x.path} ${x.blob.size}`).join(', ')); window.posted = files.map((x) => x.path); return { post: { number: 9, url: '#', key: 'k' }, artifact: { id: 'new', url: '#' } }; },
};
addEventListener('message', async (e) => {
  if (e.source !== f.contentWindow || e.data?.abstracts !== 'call') return;
  const { id, method, params } = e.data;
  try { const value = await methods[method]?.(params ?? {}); if (!methods[method]) throw { code: 'unsupported', message: method }; f.contentWindow.postMessage({ abstracts: 'result', id, ok: true, value }, '*'); }
  catch (err) { f.contentWindow.postMessage({ abstracts: 'result', id, ok: false, error: { code: err.code ?? 'failed', message: err.message ?? String(err) } }, '*'); }
});
</script>
</body>
